site_name: Kopano — Church attendance
site_description: A check-in and community app for small fellowships
site_author: Hlulani Baloyi
repo_url: https://github.com/Hlulani-B/Church
edit_uri: edit/main/Documentation-site/docs/

# Flat output: docs/architecture.md becomes architecture.html rather than architecture/index.html.
# A static host with no rewrite rule (Render's static sites among them) can then serve a deep link
# straight from disk; with directory URLs on, every page but the home page depends on the host
# inventing an index.html that is not in the request.
use_directory_urls: false

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  font:
    text: Inter
    code: JetBrains Mono

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Hlulani-B/Church

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.esm.min.mjs

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Product:
      - User stories: user-stories.md
      - Onboarding and guides: onboarding.md
  - Architecture:
      - Overview: architecture.md
      - Check-in and QR flow: check-in.md
      - Feedback: feedback.md
      - Testing: testing.md
      - Third-party dependencies: dependencies.md
  - Data:
      - Database: database.md
      - Authentication: authentication.md
      - Findings: findings.md
