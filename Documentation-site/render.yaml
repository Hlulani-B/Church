# Render blueprint for the documentation site.
#
# One static service: MkDocs builds plain HTML, so there are no secrets and no database.
# The app itself stays on Vercel, and this file does not touch it.
#
# To use it: New + then Blueprint in the Render dashboard, and point it at this repository.

services:
  - type: web
    name: kopano-docs
    runtime: static
    rootDir: Documentation-site

    # requirements.txt names mkdocs-material, which pulls MkDocs in with it.
    # --strict turns a broken internal link into a failed build.
    buildCommand: pip install -r requirements.txt && mkdocs build --strict

    # mkdocs.yml sets use_directory_urls: false, so site/ is a flat folder of .html files.
    staticPublishPath: site

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
