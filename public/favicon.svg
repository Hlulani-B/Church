<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Kopano">
  <title>Kopano</title>
  <!-- warm paper tile so the ink stays legible on light and dark browser chrome -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#f6f4ef"/>
  <!-- three hand-drawn, flowy figures leaning together, bodies sweeping to one shared base -->
  <g fill="none" stroke="#161616" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 25.5C17 33 18 42 25 46.5"/>
    <path d="M32 22.5C32 32 32 40 32 47.5"/>
    <path d="M44 25.5C47 33 46 42 39 46.5"/>
  </g>
  <g fill="#161616">
    <circle cx="20" cy="20" r="4.6"/>
    <circle cx="32" cy="16" r="5"/>
    <circle cx="44" cy="20" r="4.6"/>
  </g>
</svg>
